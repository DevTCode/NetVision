<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetVision — Connexion</title>

<!-- Fonts Poppins + Roboto -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
:root {
  --font-heading: "Poppins", sans-serif;
  --font-body:    "Roboto", system-ui, sans-serif;

  /* Palette reprise telle quelle de main.css (index.html) :
     --bg      = main.css :root --background-color (#002c61)
     --bg2     = main.css .dark-background --background-color (#0e1d34)
     --surface = main.css :root --accent-color/--surface-color (#000722)
     --surface2= main.css .dark-background --surface-color (#19335c) */
  --bg:       #002c61;
  --bg2:      #0e1d34;
  --surface:  #000722;
  --surface2: #19335c;
  --border:   rgba(0,212,255,0.08);
  --border2:  rgba(0,212,255,0.18);

  --accent:   #00d4ff;
  --accent2:  #0066ff;
  --red:      #ff3c6e;
  --amber:    #ffa500;
  --green:    #00c864;
  --purple:   #8250ff;
  /* Texte — main.css #hero p / .hero-stat-item .label : rgba(200,212,232,x) */
  --text:     #c8d4e8;
  --text-dim: rgba(200,212,232,0.45);

  --glow:   0 0 20px rgba(0,212,255,0.18);
  --glow-g: 0 0 20px rgba(0,200,100,0.18);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events:none; z-index:0;
}

.login-box {
  position: relative; z-index: 1;
  width: 100%; max-width: 460px;
  margin: 0 20px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 18px;
  padding: 38px 36px;
  box-shadow: 0 16px 60px rgba(0,0,0,.6);
  text-align: center;
}

.logo-icon-wrap {
  width:54px; height:54px; margin: 0 auto 14px;
  /* Comme .header .logo .logo-icon dans main.css : var(--accent-color)→#0066ff */
  background: linear-gradient(135deg, #000722, #0066ff);
  border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:26px; color:#fff;
  box-shadow: var(--glow);
}

.logo-name {
  font-family: var(--font-heading);
  font-size:24px; font-weight:800; color:#fff; letter-spacing:-0.5px;
}
/* "Vision" dans la même couleur que le span inline d'index.html (#0096ff) */
.logo-name span { color: #0096ff; }

.login-sub {
  font-size:12px; color:var(--text-dim);
  letter-spacing:0.8px; text-transform:uppercase;
  margin-top:6px; margin-bottom:30px;
}

.profile-grid {
  display:flex; flex-direction:column; gap:14px;
}

.profile-btn {
  display:flex; align-items:center; gap:14px;
  width:100%; padding:18px 20px;
  border-radius:12px; cursor:pointer;
  font-family:var(--font-body);
  text-align:left;
  transition: all .2s;
  text-decoration:none;
}

.profile-btn .pb-icon {
  width:44px; height:44px; flex-shrink:0;
  border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:20px;
}

.profile-btn .pb-title {
  font-family:var(--font-heading); font-size:14px; font-weight:700; color:#fff;
}
.profile-btn .pb-sub {
  font-size:11px; color:var(--text-dim); margin-top:2px;
}

.profile-btn .pb-arrow {
  margin-left:auto; color:var(--text-dim); font-size:18px; transition: transform .2s;
}
.profile-btn:hover .pb-arrow { transform: translateX(4px); }

.profile-btn.admin {
  border:1px solid rgba(0,212,255,0.3); background:rgba(0,212,255,0.06);
}
.profile-btn.admin:hover { background:rgba(0,212,255,0.12); border-color:var(--accent); }
.profile-btn.admin .pb-icon { background:rgba(0,212,255,0.15); color:var(--accent); }

.profile-btn.tech {
  border:1px solid rgba(0,200,100,0.3); background:rgba(0,200,100,0.06);
}
.profile-btn.tech:hover { background:rgba(0,200,100,0.12); border-color:var(--green); }
.profile-btn.tech .pb-icon { background:rgba(0,200,100,0.15); color:var(--green); }

.login-footer {
  margin-top:28px; font-size:10px; color:var(--text-dim);
  letter-spacing:0.5px;
}
</style>
</head>
<body>

<div class="login-box">
  <div class="logo-icon-wrap"><i class="bi bi-reception-4"></i></div>
  <div class="logo-name">Net<span>Vision</span></div>
  <div class="login-sub">Plateforme BI Télécom · Huawei Maroc</div>

  <div class="profile-grid">
    <a href="noc_admin.html" class="profile-btn admin" onclick="selectProfile('ADMIN')">
      <div class="pb-icon"><i class="bi bi-display"></i></div>
      <div>
        <div class="pb-title">NOC Admin</div>
        <div class="pb-sub">Supervision réseau, dispatch, planning</div>
      </div>
      <i class="bi bi-arrow-right-circle pb-arrow"></i>
    </a>

    <a href="tech.html" class="profile-btn tech" onclick="selectProfile('TECHNICIEN')">
      <div class="pb-icon"><i class="bi bi-person-badge"></i></div>
      <div>
        <div class="pb-title">Technicien Terrain</div>
        <div class="pb-sub">Interventions, statut, pause terrain</div>
      </div>
      <i class="bi bi-arrow-right-circle pb-arrow"></i>
    </a>
  </div>

  <div class="login-footer">PFE 2026 · Network Operations Center</div>
</div>

<script>
function selectProfile(role) {
  sessionStorage.setItem('nv_user', JSON.stringify({ role: role }));
}
</script>

</body>
</html>
